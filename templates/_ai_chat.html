<!-- Блок экономики и ИИ-ассистента -->
<section id="ai-chat" class="ai-chat-section">
    <div class="container chat-container">
        <h2 class="section-title">Умный расчёт прибыли</h2>
        <p class="section-description">Задайте параметры и получите прогноз от ИИ-ассистента</p>
        <!-- Контейнер для будущего интерфейса чата -->
        <div id="chat-interface" class="chat-placeholder">
            <div class="chat-messages" aria-live="polite">
                <p>Здесь появятся сообщения ассистента...</p>
            </div>
            <form id="chat-form" class="chat-form">
                <input type="text" id="chat-input" placeholder="Введите ваш город, площадь и т.д.">
                <button type="submit" class="btn btn-chat">Рассчитать</button>
            </form>
        </div>
    </div>
</section>
