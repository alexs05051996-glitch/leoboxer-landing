<!-- Модальное окно ИИ-чата Rocky Boxer -->
<div id="ai-chat-modal" class="b2b-modal-overlay">
    <div class="b2b-modal-content">
        <!-- Шапка модалки: заголовок + крестик -->
        <div class="b2b-modal-header">
            <span class="b2b-modal-title">Rocky Boxer | ИИ-Аналитик завода</span>
            <button class="modal-close-btn" aria-label="Закрыть">&times;</button>
        </div>

        <!-- Контейнер чата -->
        <div id="chat-interface" class="chat-interface">
            <!-- Сообщения чата -->
            <div id="chat-messages" class="chat-messages" aria-live="polite">
                <!-- Первое сообщение от Rocky Boxer добавляется через JS -->
            </div>

            <!-- Область ввода (шаги 1, 2, 3, 4, 5) -->
            <div id="chat-input-area" class="chat-input-area">
                <button id="chat-back-btn" class="btn-back" style="display: none;">←</button>
                <input type="text" id="chat-input" class="chat-input" placeholder="Введите ваш ответ..." autocomplete="off">
                <button id="chat-send-btn" class="btn btn-chat-send">Далее</button>
            </div>

            <!-- Контейнер для кнопок выбора модели (шаг 3) -->
            <div id="model-buttons" class="model-buttons" style="display: none;">
                <button class="btn btn-model" data-model-value="Взрослый Классик">
                    Взрослый Классик — 230 000 руб.
                </button>
                <button class="btn btn-model" data-model-value="Юниорский">
                    Юниорский — 230 000 руб.
                </button>
                <button class="btn btn-model" data-model-value="Детская серия">
                    Детская серия — 220 000 руб.
                </button>
            </div>

            <!-- Состояние загрузки (показывается во время SSE) -->
            <div id="chat-loading" class="chat-loading" style="display: none;">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="loading-text">Rocky Boxer генерирует расчёт...</span>
            </div>
        </div>
    </div>
</div>
