<section id="calculator" class="b2b-offer-section" data-cpa-block="cta">

            <h3 class="b2b-offer-title">Начни бизнес с надёжным партнёром!</h3>

        </div>

        <!-- Кнопка (справа) — открывает модальное окно с ИИ-расчётом -->
        <button class="b2b-offer-btn" data-scroll-to-chat>Запустить ИИ-расчёт</button>
    </div>
</section>
